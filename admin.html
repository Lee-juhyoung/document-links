<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>QR 관리</title>
  <link rel="stylesheet" href="./admin.css?v=20260929-5">
  <script type="module" src="./admin.mjs?v=20260929-5"></script>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">관리자용</p>
      <h1>QR 관리</h1>
      <p id="status" role="status" aria-live="polite">전달받은 관리자 링크로 열어주세요.</p>
      <button id="retry" class="secondary" hidden>다시 시도</button>
    </header>
    <section id="library" hidden aria-label="QR 다운로드">
      <div class="chat-entry"><div><strong>파일 추가·수정·삭제</strong><p>개발용 대화창 · PC가 켜져 있으면 사용할 수 있습니다.</p></div><a id="chat-link" hidden target="_top" rel="noreferrer">Codex와 대화</a></div>
      <nav id="page-nav" aria-label="선박별 페이지"></nav>
      <div class="toolbar">
        <div><h2 id="scope" class="badge"></h2><span id="count"></span></div>
        <button id="download-page" class="primary">이 페이지 전체 다운로드</button>
      </div>
      <div class="page-controls">
        <button id="download-all" class="text-button">모든 QR 다운로드</button>
        <div class="fold-controls">
          <button id="expand-all" class="text-button">모두 펼치기</button>
          <button id="collapse-all" class="text-button">모두 접기</button>
        </div>
      </div>
      <div class="search-bar"><label for="qr-search">이 선박에서 검색</label><div class="search-input"><input id="qr-search" type="search" placeholder="현재 선박의 장비명·번호·문서명" autocomplete="off" aria-describedby="search-result"><button id="clear-search" class="secondary" type="button">지우기</button></div></div>
      <p id="search-result" role="status" aria-live="polite" hidden></p>
      <div id="groups"></div>
      <p id="download-status" role="status" aria-live="polite"></p>
    </section>
    <noscript>QR을 보려면 브라우저에서 JavaScript를 켜주세요.</noscript>
  </main>
</body>
</html>
